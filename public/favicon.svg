<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
  </defs>
  <!-- Body - rounded budgie shape -->
  <ellipse cx="256" cy="280" rx="155" ry="190" fill="url(#body)"/>
  <!-- Head -->
  <circle cx="256" cy="140" r="110" fill="url(#body)"/>
  <!-- Wing -->
  <path d="M180 240 Q140 320 190 420 Q240 380 280 300 Q260 260 220 240 Z" fill="url(#wing)" opacity="0.7"/>
  <!-- Eye -->
  <circle cx="290" cy="120" r="28" fill="white"/>
  <circle cx="296" cy="116" r="14" fill="#1F2937"/>
  <circle cx="300" cy="112" r="5" fill="white"/>
  <!-- Beak -->
  <path d="M320 148 L360 162 L320 176 Z" fill="#FBBF24"/>
  <!-- Cheek -->
  <ellipse cx="305" cy="155" rx="18" ry="12" fill="#FCD34D" opacity="0.4"/>
  <!-- Tail -->
  <path d="M220 440 Q200 500 180 510 Q210 490 230 460 Z" fill="url(#wing)" opacity="0.6"/>
  <path d="M250 450 Q240 510 230 520 Q255 500 265 465 Z" fill="url(#wing)" opacity="0.5"/>
</svg>
